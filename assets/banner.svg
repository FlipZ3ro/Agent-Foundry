<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a72ef"/>
      <stop offset="50%" stop-color="#de1d8d"/>
      <stop offset="100%" stop-color="#ff5b4f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="20" fill="#ffffff"/>
  <rect x="1" y="1" width="1278" height="418" rx="19" fill="none" stroke="#ebebeb"/>

  <!-- subtle top pill -->
  <rect x="499" y="58" width="282" height="28" rx="9999" fill="#fafafa" stroke="#ebebeb"/>
  <text x="640" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#4d4d4d" letter-spacing="0.8">MULTI-AGENT PRODUCT OPERATING SYSTEM</text>

  <!-- hero title -->
  <text x="640" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="78" font-weight="600" fill="#171717" letter-spacing="-3.2">Agent Foundry</text>
  <text x="640" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4d4d4d">Build AI-operated products with explicit planning, routing, execution, and review.</text>

  <!-- workflow strip -->
  <line x1="390" y1="252" x2="890" y2="252" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="390" cy="252" r="5" fill="#0a72ef"/>
  <circle cx="557" cy="252" r="5" fill="#0a72ef"/>
  <circle cx="723" cy="252" r="5" fill="#de1d8d"/>
  <circle cx="890" cy="252" r="5" fill="#ff5b4f"/>

  <text x="390" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0a72ef">PLAN</text>
  <text x="557" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0a72ef">ROUTE</text>
  <text x="723" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#de1d8d">EXECUTE</text>
  <text x="890" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#ff5b4f">REVIEW</text>

  <!-- cards -->
  <g filter="url(#softShadow)">
    <rect x="188" y="322" width="280" height="58" rx="12" fill="#ffffff"/>
    <rect x="188" y="322" width="280" height="58" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="214" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#666666">STACK</text>
    <text x="214" y="366" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#171717">TypeScript · Schemas · HTTP</text>

    <rect x="500" y="322" width="280" height="58" rx="12" fill="#ffffff"/>
    <rect x="500" y="322" width="280" height="58" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="526" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#666666">FLOW</text>
    <text x="526" y="366" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#171717">Planner → Router → Workers</text>

    <rect x="812" y="322" width="280" height="58" rx="12" fill="#ffffff"/>
    <rect x="812" y="322" width="280" height="58" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="838" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#666666">USE CASE</text>
    <text x="838" y="366" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#171717">AI SaaS Factory / Agent Ops</text>
  </g>
</svg>