<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#07131a"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 140) rotate(20) scale(420 220)">
      <stop offset="0%" stop-color="#00F584" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F584" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 120) rotate(-20) scale(340 220)">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F584"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="softLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F584" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F584" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="20" fill="url(#bg1)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)" opacity="0.5"/>
  <rect width="1280" height="420" rx="20" fill="url(#glowL)"/>
  <rect width="1280" height="420" rx="20" fill="url(#glowR)"/>

  <!-- ambient lines -->
  <g opacity="0.16" stroke="#00F584" stroke-width="1.2" fill="none">
    <path d="M0 100 H210 L260 150 H420"/>
    <path d="M1280 290 H1080 L1030 235 H890"/>
    <circle cx="210" cy="100" r="4" fill="#00F584"/>
    <circle cx="420" cy="150" r="4" fill="#00F584"/>
    <circle cx="1080" cy="290" r="4" fill="#00F584"/>
    <circle cx="890" cy="235" r="4" fill="#00F584"/>
  </g>

  <!-- eyebrow -->
  <rect x="508" y="72" width="264" height="30" rx="15" fill="#0f172a" stroke="#00F584" stroke-opacity="0.35"/>
  <text x="640" y="92" text-anchor="middle" font-family="monospace" font-size="13" fill="#00F584" letter-spacing="2">MULTI-AGENT PRODUCT OPERATING SYSTEM</text>

  <!-- title -->
  <text x="640" y="168" text-anchor="middle" font-family="monospace" font-size="86" font-weight="800" fill="url(#accent)" filter="url(#glow)">AGENT FOUNDRY</text>
  <line x1="300" y1="188" x2="980" y2="188" stroke="url(#softLine)" stroke-width="1.6"/>

  <!-- subtitle -->
  <text x="640" y="226" text-anchor="middle" font-family="monospace" font-size="22" fill="#b4c4d6" letter-spacing="3">PLANNER → ROUTER → WORKER SWARM → REVIEWER</text>
  <text x="640" y="260" text-anchor="middle" font-family="monospace" font-size="17" fill="#8094a8">Launch agentic SaaS systems with explicit routing, execution lanes, and review gates.</text>

  <!-- bottom cards -->
  <g font-family="monospace">
    <rect x="250" y="305" width="220" height="54" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.28"/>
    <text x="280" y="327" font-size="12" fill="#22d3ee">STACK</text>
    <text x="280" y="347" font-size="15" fill="#e2e8f0">TypeScript · Monorepo · HTTP</text>

    <rect x="530" y="305" width="220" height="54" rx="14" fill="#0f172a" stroke="#00F584" stroke-opacity="0.28"/>
    <text x="560" y="327" font-size="12" fill="#00F584">FLOW</text>
    <text x="560" y="347" font-size="15" fill="#e2e8f0">Plan · Route · Execute · Review</text>

    <rect x="810" y="305" width="220" height="54" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.28"/>
    <text x="840" y="327" font-size="12" fill="#a78bfa">USE CASE</text>
    <text x="840" y="347" font-size="15" fill="#e2e8f0">AI SaaS Factory / Agent Ops</text>
  </g>

  <!-- corners -->
  <g stroke="#00F584" stroke-width="2" opacity="0.26">
    <path d="M24 18 V42 M24 18 H48"/>
    <path d="M1256 18 V42 M1256 18 H1232"/>
    <path d="M24 402 V378 M24 402 H48"/>
    <path d="M1256 402 V378 M1256 402 H1232"/>
  </g>
</svg>