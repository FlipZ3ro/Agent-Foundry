<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F584"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F584" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F584" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="320" fill="#0d1117" rx="16"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.5"/>

  <g opacity="0.18" stroke="#00F584" stroke-width="1.2" fill="none">
    <path d="M0 78 H220 L255 112 H360"/>
    <path d="M1200 242 H980 L945 208 H840"/>
    <circle cx="220" cy="78" r="4" fill="#00F584"/>
    <circle cx="360" cy="112" r="4" fill="#00F584"/>
    <circle cx="980" cy="242" r="4" fill="#00F584"/>
    <circle cx="840" cy="208" r="4" fill="#00F584"/>
  </g>

  <text x="600" y="128" text-anchor="middle" font-family="monospace" font-size="78" font-weight="800" fill="url(#accent)" filter="url(#glow)">AGENT FOUNDRY</text>
  <line x1="280" y1="150" x2="920" y2="150" stroke="url(#line)" stroke-width="1.5"/>
  <text x="600" y="188" text-anchor="middle" font-family="monospace" font-size="18" letter-spacing="4" fill="#9fb3c8">PLANNER → ROUTER → WORKERS → REVIEWER</text>
  <text x="600" y="216" text-anchor="middle" font-family="monospace" font-size="15" fill="#6f879e">clean multi-agent architecture for AI-operated products</text>

  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="350" y="246" width="104" height="28" rx="14" fill="#00F584" fill-opacity="0.08" stroke="#00F584" stroke-opacity="0.4"/>
    <text x="402" y="264" fill="#00F584">TYPESCRIPT</text>

    <rect x="470" y="246" width="90" height="28" rx="14" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="515" y="264" fill="#22d3ee">MONOREPO</text>

    <rect x="576" y="246" width="84" height="28" rx="14" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.4"/>
    <text x="618" y="264" fill="#fbbf24">SWARM</text>

    <rect x="676" y="246" width="100" height="28" rx="14" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="726" y="264" fill="#a78bfa">REVIEWABLE</text>

    <rect x="792" y="246" width="112" height="28" rx="14" fill="#fb7185" fill-opacity="0.08" stroke="#fb7185" stroke-opacity="0.4"/>
    <text x="848" y="264" fill="#fb7185">AGENT OPS</text>
  </g>

  <g stroke="#00F584" stroke-width="2" opacity="0.28">
    <path d="M22 14 V36 M22 14 H44"/>
    <path d="M1178 14 V36 M1178 14 H1156"/>
    <path d="M22 306 V284 M22 306 H44"/>
    <path d="M1178 306 V284 M1178 306 H1156"/>
  </g>
</svg>