<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr-c" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/></marker>
    <marker id="arr-e" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00F584"/></marker>
    <marker id="arr-a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/></marker>
    <marker id="arr-v" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/></marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fb7185"/></marker>
    <marker id="arr-s" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="760" fill="#020617" rx="16"/>
  <rect width="1200" height="760" fill="url(#grid)" rx="16"/>

  <text x="600" y="42" text-anchor="middle" font-family="monospace" font-size="18" fill="#00F584" font-weight="700" letter-spacing="3">AGENT FOUNDRY ARCHITECTURE</text>
  <line x1="420" y1="50" x2="780" y2="50" stroke="#00F584" opacity="0.35"/>

  <!-- arrows -->
  <line x1="600" y1="104" x2="600" y2="152" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arr-c)"/>
  <line x1="600" y1="234" x2="600" y2="282" stroke="#00F584" stroke-width="1.7" marker-end="url(#arr-e)"/>

  <path d="M 600 364 L 270 364 L 270 402" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
  <path d="M 600 364 L 600 402" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-v)"/>
  <path d="M 600 364 L 930 364 L 930 402" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <text x="435" y="350" font-family="monospace" font-size="9" fill="#fbbf24">route to one or more lanes</text>

  <line x1="270" y1="468" x2="270" y2="520" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="600" y1="468" x2="600" y2="520" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="930" y1="468" x2="930" y2="520" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="270" y1="520" x2="930" y2="520" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4"/>
  <line x1="600" y1="520" x2="600" y2="562" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arr-s)"/>
  <text x="620" y="514" font-family="monospace" font-size="9" fill="#94a3b8">merge for review</text>

  <line x1="600" y1="644" x2="600" y2="690" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arr-c)"/>

