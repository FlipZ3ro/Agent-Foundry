<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="workflow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a72ef"/>
      <stop offset="60%" stop-color="#de1d8d"/>
      <stop offset="100%" stop-color="#ff5b4f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="758" rx="15" fill="none" stroke="#ebebeb"/>

  <text x="600" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#171717" letter-spacing="-0.8">Agent Foundry architecture</text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#666666">A minimal multi-agent system for planning, routing, execution, and review.</text>

  <g filter="url(#softShadow)">
    <rect x="390" y="108" width="420" height="64" rx="12" fill="#ffffff"/>
    <rect x="390" y="108" width="420" height="64" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="420" y="132" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#666666">INPUT</text>
    <text x="420" y="156" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#171717">Product idea, feature request, or research brief</text>
  </g>

  <line x1="600" y1="172" x2="600" y2="214" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>

  <g filter="url(#softShadow)">
    <rect x="390" y="214" width="420" height="90" rx="12" fill="#ffffff"/>
    <rect x="390" y="214" width="420" height="90" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="420" y="240" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0a72ef">PLAN</text>
    <text x="420" y="266" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#171717" letter-spacing="-1.2">Planner</text>
    <text x="420" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4d4d4d">Turns requests into strategy, tasks, and acceptance criteria.</text>
  </g>

  <line x1="600" y1="304" x2="600" y2="346" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>

  <g filter="url(#softShadow)">
    <rect x="390" y="346" width="420" height="90" rx="12" fill="#ffffff"/>
    <rect x="390" y="346" width="420" height="90" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="420" y="372" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0a72ef">ROUTE</text>
    <text x="420" y="398" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#171717" letter-spacing="-1.2">Router</text>
    <text x="420" y="422" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4d4d4d">Selects one or more lanes based on the job shape.</text>
  </g>

  <line x1="600" y1="436" x2="600" y2="470" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="270" y1="470" x2="930" y2="470" stroke="url(#workflow)" stroke-width="2" stroke-linecap="round"/>
  <line x1="270" y1="470" x2="270" y2="500" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="600" y1="470" x2="600" y2="500" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="930" y1="470" x2="930" y2="500" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>

  <g filter="url(#softShadow)">
    <rect x="120" y="500" width="300" height="92" rx="12" fill="#ffffff"/>
    <rect x="120" y="500" width="300" height="92" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="148" y="526" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0a72ef">EXECUTE</text>
    <text x="148" y="552" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#171717" letter-spacing="-1">Frontend lane</text>
    <text x="148" y="575" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4d4d4d">Landing pages, UI copy, and README visuals.</text>

    <rect x="450" y="500" width="300" height="92" rx="12" fill="#ffffff"/>
    <rect x="450" y="500" width="300" height="92" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="478" y="526" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#de1d8d">EXECUTE</text>
    <text x="478" y="552" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#171717" letter-spacing="-1">Backend lane</text>
    <text x="478" y="575" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4d4d4d">Schemas, APIs, services, and orchestration logic.</text>

    <rect x="780" y="500" width="300" height="92" rx="12" fill="#ffffff"/>
    <rect x="780" y="500" width="300" height="92" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="808" y="526" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#ff5b4f">EXECUTE</text>
    <text x="808" y="552" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#171717" letter-spacing="-1">Research lane</text>
    <text x="808" y="575" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4d4d4d">Market scan, content inputs, and strategy support.</text>
  </g>

  <line x1="270" y1="592" x2="270" y2="626" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="600" y1="592" x2="600" y2="626" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="930" y1="592" x2="930" y2="626" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="270" y1="626" x2="930" y2="626" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="600" y1="626" x2="600" y2="658" stroke="#171717" stroke-opacity="0.12" stroke-width="2"/>

  <g filter="url(#softShadow)">
    <rect x="390" y="658" width="420" height="72" rx="12" fill="#ffffff"/>
    <rect x="390" y="658" width="420" height="72" rx="12" fill="none" stroke="#ebebeb"/>
    <text x="420" y="684" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#ff5b4f">REVIEW</text>
    <text x="420" y="710" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#171717" letter-spacing="-1">Reviewer → Run history</text>
    <text x="420" y="724" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4d4d4d">Evaluates output, routes revisions, and records lifecycle.</text>
  </g>

  <rect x="76" y="214" width="250" height="82" rx="12" fill="#fafafa" stroke="#ebebeb"/>
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#666666">WHY THIS SHAPE</text>
  <text x="100" y="264" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#171717">Separate reasoning from execution.</text>
  <text x="100" y="286" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">Lower cost and clearer observability.</text>

  <rect x="874" y="214" width="250" height="82" rx="12" fill="#fafafa" stroke="#ebebeb"/>
  <text x="898" y="240" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#666666">CURRENT REPO</text>
  <text x="898" y="264" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#171717">Schemas + orchestrator + HTTP.</text>
  <text x="898" y="286" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">Worker and review stages stay explicit.</text>
</svg>