<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr-c" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/></marker>
    <marker id="arr-e" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00F584"/></marker>
    <marker id="arr-a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/></marker>
    <marker id="arr-v" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/></marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fb7185"/></marker>
    <marker id="arr-s" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1100" height="640" fill="#020617" rx="12"/>
  <rect width="1100" height="640" fill="url(#grid)"/>

  <text x="550" y="36" text-anchor="middle" font-family="monospace" font-size="16" fill="#00F584" font-weight="700" letter-spacing="3">SYSTEM ARCHITECTURE</text>
  <line x1="420" y1="44" x2="680" y2="44" stroke="#00F584" stroke-width="0.8" opacity="0.35"/>

  <!-- arrows behind -->
  <line x1="550" y1="105" x2="550" y2="150" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arr-c)"/>
  <line x1="550" y1="215" x2="550" y2="260" stroke="#00F584" stroke-width="1.6" marker-end="url(#arr-e)"/>

  <path d="M 550 325 L 240 325 L 240 350" fill="none" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#arr-a)"/>
  <text x="388" y="316" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle">frontend lane</text>

  <path d="M 550 325 L 550 350" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arr-v)"/>
  <text x="585" y="338" font-family="monospace" font-size="8" fill="#a78bfa">backend lane</text>

  <path d="M 550 325 L 860 325 L 860 350" fill="none" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arr-r)"/>
  <text x="705" y="316" font-family="monospace" font-size="8" fill="#fb7185" text-anchor="middle">research lane</text>

  <path d="M 240 410 L 240 450 L 550 450 L 550 470" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr-s)"/>
  <path d="M 550 410 L 550 470" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr-s)"/>
  <path d="M 860 410 L 860 450 L 550 450 L 550 470" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr-s)"/>

  <line x1="550" y1="535" x2="550" y2="570" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arr-c)"/>

  <!-- top source -->
  <rect x="435" y="60" width="230" height="45" rx="8" fill="#0f172a"/>
  <rect x="435" y="60" width="230" height="45" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="80" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="700">Product Idea / Request</text>
  <text x="550" y="94" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">startup brief · feature ask · campaign · research task</text>

  <!-- planner -->
  <rect x="420" y="150" width="260" height="65" rx="8" fill="#0f172a"/>
  <rect x="420" y="150" width="260" height="65" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="550" y="177" text-anchor="middle" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="800">Planner</text>
  <text x="550" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="#22d3ee">strategy · decomposition · acceptance criteria</text>
  <text x="550" y="206" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">project blueprint + task breakdown</text>

  <!-- router -->
  <rect x="420" y="260" width="260" height="65" rx="8" fill="#0f172a"/>
  <rect x="420" y="260" width="260" height="65" rx="8" fill="rgba(6,78,59,0.4)" stroke="#00F584" stroke-width="1.5"/>
  <text x="550" y="287" text-anchor="middle" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="800" filter="url(#glow)">Router</text>
  <text x="550" y="304" text-anchor="middle" font-family="monospace" font-size="9" fill="#00F584">reasoning-heavy / execution-heavy / hybrid</text>
  <text x="550" y="316" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">decides lane + job shape</text>

  <!-- workers group boundary -->
  <rect x="95" y="350" width="910" height="90" rx="12" fill="rgba(251,146,60,0.04)" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="550" y="366" text-anchor="middle" font-family="monospace" font-size="10" fill="#fb923c" font-weight="700">WORKER SWARM</text>

  <!-- lanes -->
  <rect x="140" y="350" width="200" height="60" rx="8" fill="#0f172a"/>
  <rect x="140" y="350" width="200" height="60" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="240" y="376" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="700">Frontend Lane</text>
  <text x="240" y="392" text-anchor="middle" font-family="monospace" font-size="8" fill="#fbbf24">landing · UI copy · docs visuals</text>
  <text x="240" y="404" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">worker(s)</text>

  <rect x="450" y="350" width="200" height="60" rx="8" fill="#0f172a"/>
  <rect x="450" y="350" width="200" height="60" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="376" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="700">Backend Lane</text>
  <text x="550" y="392" text-anchor="middle" font-family="monospace" font-size="8" fill="#a78bfa">APIs · schemas · services · infra glue</text>
  <text x="550" y="404" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">worker(s)</text>

  <rect x="760" y="350" width="200" height="60" rx="8" fill="#0f172a"/>
  <rect x="760" y="350" width="200" height="60" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="860" y="376" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="700">Research Lane</text>
  <text x="860" y="392" text-anchor="middle" font-family="monospace" font-size="8" fill="#fb7185">market scan · content · strategy inputs</text>
  <text x="860" y="404" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">worker(s)</text>

  <!-- reviewer -->
  <rect x="400" y="470" width="300" height="65" rx="8" fill="#0f172a"/>
  <rect x="400" y="470" width="300" height="65" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="550" y="497" text-anchor="middle" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="800">Reviewer</text>
  <text x="550" y="514" text-anchor="middle" font-family="monospace" font-size="9" fill="#22d3ee">pass / revise / fail</text>
  <text x="550" y="526" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">checks acceptance criteria + output quality</text>

  <!-- run history -->
  <rect x="405" y="570" width="290" height="45" rx="8" fill="#0f172a"/>
  <rect x="405" y="570" width="290" height="45" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="590" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="700">Run History</text>
  <text x="550" y="604" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">jobs · results · notes · retries · lifecycle events</text>

  <!-- side callouts -->
  <rect x="735" y="150" width="260" height="64" rx="8" fill="rgba(0,245,132,0.05)" stroke="#00F584" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="865" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#00F584" font-weight="700">Current repo shape</text>
  <text x="865" y="188" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">packages/schemas</text>
  <text x="865" y="200" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">services/orchestrator · worker · reviewer · http</text>

  <rect x="105" y="150" width="250" height="64" rx="8" fill="rgba(34,211,238,0.05)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="230" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#22d3ee" font-weight="700">Core principle</text>
  <text x="230" y="188" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">separate reasoning, routing, execution, review</text>
  <text x="230" y="200" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">for lower cost + clearer observability</text>

  <!-- legend -->
  <g transform="translate(120, 620)" font-family="monospace">
    <rect x="0" y="-10" width="10" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="16" y="-2" font-size="8" fill="#94a3b8">planning/review</text>
    <rect x="120" y="-10" width="10" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#00F584" stroke-width="1"/>
    <text x="136" y="-2" font-size="8" fill="#94a3b8">routing/core</text>
    <rect x="230" y="-10" width="10" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="246" y="-2" font-size="8" fill="#94a3b8">worker lane</text>
    <line x1="340" y1="-5" x2="360" y2="-5" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.2"/>
    <text x="366" y="-2" font-size="8" fill="#94a3b8">fan-in review path</text>
  </g>
</svg>