  <text x="600" y="95" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">product idea · feature request · campaign brief · research ask</text>

  <rect x="410" y="152" width="380" height="82" rx="12" fill="#0f172a"/>
  <rect x="410" y="152" width="380" height="82" rx="12" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="600" y="184" text-anchor="middle" font-family="monospace" font-size="18" fill="#e2e8f0" font-weight="800">Planner</text>
  <text x="600" y="205" text-anchor="middle" font-family="monospace" font-size="10" fill="#22d3ee">strategy · decomposition · acceptance criteria</text>
  <text x="600" y="220" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">outputs project blueprint + task specs</text>

  <rect x="410" y="282" width="380" height="82" rx="12" fill="#0f172a"/>
  <rect x="410" y="282" width="380" height="82" rx="12" fill="rgba(6,78,59,0.4)" stroke="#00F584" stroke-width="1.6"/>
  <text x="600" y="314" text-anchor="middle" font-family="monospace" font-size="18" fill="#e2e8f0" font-weight="800" filter="url(#glow)">Router</text>
  <text x="600" y="335" text-anchor="middle" font-family="monospace" font-size="10" fill="#00F584">reasoning-heavy / execution-heavy / hybrid</text>
  <text x="600" y="350" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">decides lane, parallelism, and job shape</text>

  <rect x="120" y="402" width="960" height="80" rx="14" fill="rgba(251,146,60,0.04)" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="600" y="422" text-anchor="middle" font-family="monospace" font-size="11" fill="#fb923c" font-weight="700">WORKER SWARM</text>

  <rect x="170" y="408" width="200" height="60" rx="10" fill="#0f172a"/>
  <rect x="170" y="408" width="200" height="60" rx="10" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="270" y="434" text-anchor="middle" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="700">Frontend Lane</text>
  <text x="270" y="450" text-anchor="middle" font-family="monospace" font-size="9" fill="#fbbf24">landing · UI copy · README visuals</text>
  <text x="270" y="462" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">worker(s)</text>

  <rect x="500" y="408" width="200" height="60" rx="10" fill="#0f172a"/>
  <rect x="500" y="408" width="200" height="60" rx="10" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="434" text-anchor="middle" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="700">Backend Lane</text>
  <text x="600" y="450" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa">APIs · schemas · services · infra glue</text>
  <text x="600" y="462" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">worker(s)</text>

  <rect x="830" y="408" width="200" height="60" rx="10" fill="#0f172a"/>
  <rect x="830" y="408" width="200" height="60" rx="10" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="930" y="434" text-anchor="middle" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="700">Research Lane</text>
  <text x="930" y="450" text-anchor="middle" font-family="monospace" font-size="9" fill="#fb7185">market scan · content · strategy inputs</text>
  <text x="930" y="462" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">worker(s)</text>

  <circle cx="600" cy="520" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>

  <rect x="380" y="562" width="440" height="82" rx="12" fill="#0f172a"/>
  <rect x="380" y="562" width="440" height="82" rx="12" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="600" y="594" text-anchor="middle" font-family="monospace" font-size="18" fill="#e2e8f0" font-weight="800">Reviewer</text>
  <text x="600" y="615" text-anchor="middle" font-family="monospace" font-size="10" fill="#22d3ee">pass / revise / fail</text>
  <text x="600" y="630" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">checks criteria, output quality, and contract completeness</text>

  <rect x="400" y="690" width="400" height="46" rx="10" fill="#0f172a"/>
  <rect x="400" y="690" width="400" height="46" rx="10" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="709" text-anchor="middle" font-family="monospace" font-size="13" fill="#e2e8f0" font-weight="700">Run History</text>
  <text x="600" y="724" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">jobs · results · retries · notes · lifecycle events</text>

  <!-- side cards -->
  <rect x="70" y="152" width="260" height="78" rx="10" fill="rgba(34,211,238,0.05)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="200" y="176" text-anchor="middle" font-family="monospace" font-size="11" fill="#22d3ee" font-weight="700">Core principle</text>
  <text x="200" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">separate reasoning, routing, execution,</text>
  <text x="200" y="208" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">and review for cost + observability</text>

  <rect x="870" y="152" width="260" height="78" rx="10" fill="rgba(0,245,132,0.05)" stroke="#00F584" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1000" y="176" text-anchor="middle" font-family="monospace" font-size="11" fill="#00F584" font-weight="700">Current repo shape</text>
  <text x="1000" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">packages/schemas</text>
  <text x="1000" y="208" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">orchestrator · worker · reviewer · http</text>

  <!-- legend -->
  <g transform="translate(90, 748)" font-family="monospace">
    <rect x="0" y="-10" width="10" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="16" y="-2" font-size="8" fill="#94a3b8">planning/review</text>
    <rect x="124" y="-10" width="10" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#00F584" stroke-width="1"/>
    <text x="140" y="-2" font-size="8" fill="#94a3b8">routing/core</text>
    <rect x="242" y="-10" width="10" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="258" y="-2" font-size="8" fill="#94a3b8">worker lane</text>
    <line x1="364" y1="-5" x2="384" y2="-5" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.2"/>
    <text x="390" y="-2" font-size="8" fill="#94a3b8">merge/review path</text>
  </g>
