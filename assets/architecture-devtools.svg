<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,10 L10,5 L0,0 z" fill="#00d992"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00d992" flood-opacity="0.25"/>
    </filter>
    <style>
      .node{fill:#101010;stroke:#3d3a39;stroke-width:2;}
      .node-hot{fill:#101010;stroke:#00d992;stroke-width:2;}
      .label{fill:#f2f2f2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
      .sub{fill:#b8b3b0;font-family:Inter,system-ui,sans-serif;}
      .mono{fill:#f2f2f2;font-family:SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
      .mono-sm{fill:#8b949e;font-family:SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
      .green{fill:#00d992;}
      .wire{stroke:#3d3a39;stroke-width:2;fill:none;marker-end:url(#arrow);}
      .wire-hot{stroke:#00d992;stroke-width:2;fill:none;marker-end:url(#arrow);}
      .wire-dashed{stroke:#3d3a39;stroke-width:1.5;stroke-dasharray:5,4;fill:none;}
      .zone{fill:#050507;stroke:#3d3a39;stroke-width:1.5;rx:12;}
    </style>
  </defs>

  <rect width="1280" height="640" rx="20" fill="#050507"/>
  <rect x="1" y="1" width="1278" height="638" rx="19" fill="none" stroke="#3d3a39"/>

  <!-- title -->
  <text class="label" font-size="22" font-weight="600" x="80" y="54" letter-spacing="0.4">swarmforge architecture</text>
  <text class="sub" font-size="14" x="80" y="80">terminal-first planner → router → worker → reviewer pipeline</text>

  <!-- input entry -->
  <g transform="translate(80,110)">
    <rect class="node" width="210" height="88" rx="10"/>
    <text class="mono" font-size="16" x="20" y="34"> /foundry &lt;goal&gt;</text>
    <text class="mono-sm" font-size="12" x="20" y="62">parse job → define lane → init run</text>
  </g>

  <!-- planner -->
  <g transform="translate(380,110)">
    <rect class="node-hot" width="220" height="88" rx="10"/>
    <text class="green" font-size="16" font-weight="600" x="20" y="34">planner</text>
    <text class="mono-sm" font-size="12" x="20" y="56">strategy + decomposition</text>
    <text class="mono-sm" font-size="12" x="20" y="76">choices → tasks → deliverables</text>
  </g>

  <!-- router -->
  <g transform="translate(700,110)">
    <rect class="node-hot" width="220" height="88" rx="10"/>
    <text class="green" font-size="16" font-weight="600" x="20" y="34">router</text>
    <text class="mono-sm" font-size="12" x="20" y="56">lane selection + job shape</text>
    <text class="mono-sm" font-size="12" x="20" y="76">assign specialist roles</text>
  </g>

  <!-- lane selector -->
  <g transform="translate(1010,110)">
    <rect class="node" width="190" height="88" rx="10"/>
    <text class="mono" font-size="15" x="20" y="34">lane profiles</text>
    <text class="mono-sm" font-size="12" x="20" y="60">codegen / research / ops</text>
    <text class="mono-sm" font-size="12" x="20" y="78">templates / priorities</text>
  </g>

  <!-- wires top -->
  <path class="wire" d="M290,154 L380,154"/>
  <path class="wire-hot" d="M600,154 L700,154"/>
  <path class="wire" d="M920,154 L1010,154"/>

  <!-- coordinator zone -->
  <rect class="zone" x="80" y="235" width="1120" height="290"/>
  <text class="label" font-size="16" font-weight="600" x="106" y="270">coordinator</text>
  <text class="sub" font-size="12" x="206" y="270">shared state · progress · validation</text>

  <!-- workers -->
  <g transform="translate(110,295)">
    <rect class="node" width="220" height="96" rx="10"/>
    <text class="label" font-size="15" font-weight="600" x="20" y="34">frontend worker</text>
    <text class="mono-sm" font-size="12" x="20" y="56">UI, flows, layouts</text>
    <text class="mono-sm" font-size="12" x="20" y="76">playwright / component tests</text>
  </g>

  <g transform="translate(370,295)">
    <rect class="node" width="220" height="96" rx="10"/>
    <text class="label" font-size="15" font-weight="600" x="20" y="34">backend worker</text>
    <text class="mono-sm" font-size="12" x="20" y="56">API, contracts, persistence</text>
    <text class="mono-sm" font-size="12" x="20" y="76">lint + typecheck + unit tests</text>
  </g>

  <g transform="translate(630,295)">
    <rect class="node" width="220" height="96" rx="10"/>
    <text class="label" font-size="15" font-weight="600" x="20" y="34">research worker</text>
    <text class="mono-sm" font-size="12" x="20" y="56">scope, specs, references</text>
    <text class="mono-sm" font-size="12" x="20" y="76">web / repo / docs retrieval</text>
  </g>

  <g transform="translate(890,295)">
    <rect class="node-hot" width="220" height="96" rx="10"/>
    <text class="green" font-size="15" font-weight="600" x="20" y="34">reviewer</text>
    <text class="mono-sm" font-size="12" x="20" y="56">verdict: pass / revise / fail</text>
    <text class="mono-sm" font-size="12" x="20" y="76">fix-plan → queue back to workers</text>
  </g>

  <!-- worker wires -->
  <path class="wire" d="M190,198 L190,220 L190,295"/>
  <path class="wire" d="M490,198 L490,220 L490,295"/>
  <path class="wire" d="M740,198 L740,220 L740,295"/>
  <path class="wire-hot" d="M810,343 L890,343"/>

  <!-- feedback loop -->
  <path class="wire-hot" d="M890,426 L890,460 Q890,485 862,485 L370,485 Q342,485 342,460 L342,400"/>
  <text class="mono-sm" font-size="12" x="520" y="504">fix-loop → reassign to workers until verdict passes</text>

  <!-- exit -->
  <g transform="translate(440,555)">
    <rect class="node-hot" width="400" height="60" rx="10"/>
    <text class="label" font-size="15" font-weight="600" x="20" y="36">run complete → artifacts + diff + test results + handoff</text>
  </g>

  <path class="wire-hot" d="M640,530 L640,555"/>
</svg>